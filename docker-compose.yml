# Local development stack for cloud-storage testing.
# Image tags are pinned — keep in sync with tests/integration/constants.py.
# Start:  docker compose up -d
# Stop:   docker compose down
#
# S3 credentials/bucket:  rustfsadmin / rustfsadmin  →  bucket "gflow-test"
# GCS emulator:           set STORAGE_EMULATOR_HOST=http://localhost:4443

services:
  # S3-compatible local storage (RustFS) — for testing the [s3] extra without real AWS.
  # Replaces MinIO, whose community images were removed from Docker Hub in Sep 2026.
  # Endpoint: http://localhost:9000
  # Console:  http://localhost:9001
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GCS emulator — for testing the [gcs] extra without real Google Cloud.
  # Endpoint: http://localhost:4443
  fake-gcs:
    image: fsouza/fake-gcs-server:1.49.3
    command: -scheme http -port 4443 -backend filesystem -data /data
    ports:
      - "4443:4443"
    volumes:
      - fake_gcs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4443/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rustfs_data:
  fake_gcs_data:
